[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "cml-repairnet"
version = "0.7.0"
description = "Structure-aware and uncertainty-calibrated prediction of site-specific enzymatic CML repair"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = {text = "Apache-2.0"}
authors = [{name = "CML-RepairNet contributors"}]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "scipy>=1.12,<2",
  "scikit-learn>=1.5,<2",
  "biopython>=1.84,<2",
  "requests>=2.32,<3",
  "beautifulsoup4>=4.12,<5",
  "openpyxl>=3.1,<4",
  "pyyaml>=6,<7",
  "joblib>=1.4,<2",
  "matplotlib>=3.9,<4",
  "networkx>=3.2,<4",
  "tabulate>=0.9,<1",
]

[project.optional-dependencies]
plm = [
  "torch>=2.2",
  "transformers>=4.46,<5",
]
experiment = [
  "optuna>=4,<5",
  "mlflow>=2.17,<4",
  "shap>=0.46,<1",
  "xgboost>=2.1,<4",
  "lightgbm>=4.3,<5",
]
simulation = [
  "MDAnalysis>=2.7,<3",
  "mdtraj>=1.10,<2",
  "openmm>=8.1,<9",
  "vina>=1.2,<2",
]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.7,<1",
  "mypy>=1.13,<2",
]

[project.scripts]
cml-repairnet = "cml_repairnet.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cml_repairnet"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
