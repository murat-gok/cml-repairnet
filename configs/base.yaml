  primary_metric: mae
  conformal_alpha: 0.10

virtual_screening:
  batch_size: 24
  repairability_weight: 0.20
  uncertainty_weight: 0.25
  biological_priority_weight: 0.20
  diversity_weight: 0.20
  ood_penalty_weight: 0.10
  compute_cost_penalty_weight: 0.05

multifidelity:
  enable_docking: false
