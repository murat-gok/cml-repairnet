name: tests

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_slow:
        description: "Also run the slow permutation-control tests"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,experiment]"

      - name: Run tests
        # The tests marked slow refit the permutation controls behind the
        # manuscript and take tens of minutes each; they are run deliberately
        # (workflow_dispatch below), not on every push.
        run: python -m pytest -q -m "not slow"

      - name: Run Ruff
        run: |
          ruff check src scripts tests \
            --select E9,F63,F7,F82 \
            --output-format=github

  slow:
    # The full scientific-integrity suite, including the permutation
    # controls. Started by hand from the Actions tab.
    if: github.event_name == 'workflow_dispatch' && inputs.run_slow
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,experiment]"
      - run: python -m pytest -q -m slow
